[tools]
terraform = "1.17.2"
vault = "2.2.2"
awscli = "2.40.3"
python = "3.15.2"

[tasks.setup]
description = "Install the pinned MkDocs packages"
run = "python -m pip install --no-cache-dir --requirement requirements.txt"

[tasks.build]
depends = ["setup"]
description = "Build the guide and fail on warnings"
run = "mkdocs build --strict"

[tasks.serve]
depends = ["setup"]
description = "Serve the guide locally"
run = "mkdocs serve"

[tasks.start]
description = "Start the Floci and PostgreSQL containers"
run = "docker compose up --detach"

[tasks.stop]
description = "Stop the containers and remove their data"
run = "docker compose down --volumes"

[tasks.customer-start]
description = "Start the Mossvale Supply customer environment"
run = """sh -eu -c '
dir="${MOSSVALE_DIR:-submissions/capstone/code/mossvale-supply}"
docker compose --project-name mossvale-supply --project-directory "$dir" -f "$dir/compose.yml" up --detach
'"""

[tasks.customer-reset]
description = "Reset and start the Mossvale Supply customer environment"
run = """sh -eu -c '
dir="${MOSSVALE_DIR:-submissions/capstone/code/mossvale-supply}"
docker compose --project-name mossvale-supply --project-directory "$dir" -f "$dir/compose.yml" down --volumes --remove-orphans
docker compose --project-name mossvale-supply --project-directory "$dir" -f "$dir/compose.yml" up --detach
'"""
