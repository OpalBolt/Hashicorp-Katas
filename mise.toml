[tools]
terraform = "1.17.2"
vault = "2.2.2"
awscli = "2.40.3"
python = "3.15.2"

[tasks.install]
description = "Install the pinned MkDocs packages"
run = "python -m pip install --no-cache-dir --requirement requirements.txt"

[tasks.setup]
description = "Start and check the local training services"
run = "sh scripts/setup.sh"

[tasks.build]
depends = ["install"]
description = "Build the guide and fail on warnings"
run = "mkdocs build --strict"

[tasks.serve]
depends = ["install"]
description = "Serve the guide locally"
run = "mkdocs serve"

[tasks.start]
description = "Start the Floci, Floci UI, and PostgreSQL containers"
run = "sh scripts/container.sh compose up --detach"

[tasks.stop]
description = "Stop the containers and remove their data"
run = "sh scripts/container.sh compose down --volumes"

[tasks.customer-start]
description = "Start the Mossvale Supply customer environment"
run = "sh scripts/mossvale-customer.sh start"

[tasks.customer-reset]
description = "Reset and start the Mossvale Supply customer environment"
run = "sh scripts/mossvale-customer.sh reset"
