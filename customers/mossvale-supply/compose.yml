services:
  vault:
    image: hashicorp/vault:1.18
    command: server -dev
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: mossvale-root-token
    ports:
      - "127.0.0.1:18200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 15

  vault-seed:
    image: hashicorp/vault:1.18
    entrypoint:
      - /bin/sh
      - /vault/seed.sh
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: mossvale-root-token
    volumes:
      - ./vault/seed.sh:/vault/seed.sh:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mossvale
      POSTGRES_USER: mossvale_app
      POSTGRES_PASSWORD: mossvale-db-password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
