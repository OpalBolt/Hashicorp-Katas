services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"

  floci-ui:
    image: floci/floci-ui:latest
    environment:
      FLOCI_CLOUD: aws
      FLOCI_ENDPOINT: http://floci:4566
    ports:
      - "127.0.0.1:4500:4500"
    depends_on:
      - floci

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
