site_name: Terraform and Vault training
site_description: Hands-on Terraform and Vault practice for consulting work
docs_dir: docs
theme:
  name: material
  icon:
    logo: simple/hashicorp
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
  - tags
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Local setup: setup.md
  - How grading works: grading.md
  - Tracks: tracks.md
  - Terraform:
      - "Terraform 01 — Terraform workflow": slices/terraform/01-workflow.md
      - "Terraform 02 — Terraform state and drift": slices/terraform/02-state.md
      - "Terraform 03 — Terraform HCL and modules": slices/terraform/03-modules.md
  - Vault:
      - "Vault 01 — Vault first contact": slices/vault/01-vault-first-contact.md
      - "Vault 02 — Vault as a real server": slices/vault/02-vault-server.md
      - "Vault 03 — Vault dynamic secrets and rotation": slices/vault/03-dynamic-secrets.md
      - "Vault 04 — Vault PKI and transit": slices/vault/04-pki-transit.md
  - Terraform + Vault:
      - "Terraform + Vault 01 — Terraform with Vault": slices/terraform-vault/01-terraform-vault.md
      - "Terraform + Vault 02 — CI/CD with no stored secrets": slices/terraform-vault/02-ci.md
  - Adversary:
      - "Adversary 01 — Licensing and Enterprise": slices/adversary/01-advisory.md
  - Capstone: capstone.md
